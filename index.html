<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hannah Janicke — Pick a Can</title>
<meta name="description" content="Type a code, press OK, click your can — a vending machine that links to Hannah Janicke's projects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="hero">
  <h1 class="brand-outline">
    <span>Hannah</span>
    <span>Janicke</span>
  </h1>
  <p class="hint">select your destination ↓</p>
</header>

<main class="machine-wrap">
  <div class="machine">
    <div class="machine-trim" aria-hidden="true"></div>
    <h2 class="wordmark-outline">HANJAN</h2>

    <div class="panels">
      <div class="panel panel-cans">
        <div class="cans-grid" id="cansGrid"><!-- cans injected --></div>
        <p class="status-strip" id="statusStrip">enter code to dispense</p>
      </div>

      <div class="panel panel-controls">
        <div class="display-block">
          <p class="display-label">✦ display ✦</p>
          <div class="lcd" id="lcd">INSERT CODE</div>
        </div>
        <div class="keypad" id="keypad"><!-- keys injected --></div>
        <div class="menu">
          <p class="menu-title">— menu —</p>
          <ul class="menu-list" id="menuList"><!-- items injected --></ul>
        </div>
      </div>
    </div>

    <div class="tray">
      <p class="tray-label" id="trayLabel">collection tray</p>
      <div class="tray-can-wrap" id="trayCanWrap" hidden>
        <button class="tray-can" id="trayCan" type="button"></button>
        <span class="tray-can-hint">tap to open</span>
      </div>
    </div>

    <div class="feet" aria-hidden="true">
      <span class="foot"></span>
      <span class="foot"></span>
    </div>
  </div>
</main>

<footer class="instructions">
  type a code (A1–A6) → press OK → click the can in the tray
</footer>

<script src="js/main.js"></script>
</body>
</html>
